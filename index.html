
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack Pro | Modern Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            fontSize: {
              'xxs': '0.625rem',
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --transition-speed: 0.25s;
      }
      body {
        transition: background-color var(--transition-speed), color var(--transition-speed);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.6;
      }
      .dark body {
        background-color: #020617;
        color: #f1f5f9;
      }
      html:not(.dark) body {
        background-color: #f8fafc;
        color: #0f172a;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
        border: 2px solid #020617;
      }
      html:not(.dark) ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
        border: 2px solid #f8fafc;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      .bento-card {
        backdrop-filter: blur(16px);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }
      .dark .bento-card {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(51, 65, 85, 0.6);
      }
      html:not(.dark) .bento-card {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(203, 213, 225, 0.8);
        box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.04);
      }
      .bento-card:hover {
        transform: translateY(-2px);
      }
      .dark .bento-card:hover {
        border-color: rgba(99, 102, 241, 0.5);
        box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.5);
      }
      html:not(.dark) .bento-card:hover {
        border-color: rgba(99, 102, 241, 0.3);
        box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.1);
      }
      
      @keyframes slideUpFade {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-in {
        animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Better readability for text blocks */
      .prose {
        max-width: none;
        font-size: 0.9375rem;
      }
      .prose p { margin-bottom: 0.75rem; }
      .prose ul { margin-top: 0.5rem; margin-bottom: 1rem; list-style-type: none; padding-left: 0; }
      .prose li { position: relative; padding-left: 1.5rem; margin-bottom: 0.5rem; }
      .prose li::before {
        content: "•";
        position: absolute;
        left: 0.25rem;
        color: #6366f1;
        font-weight: bold;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom": "https://esm.sh/react-dom@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "jspdf": "https://esm.sh/jspdf@^2.5.1",
        "jspdf-autotable": "https://esm.sh/jspdf-autotable@^3.8.2"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
